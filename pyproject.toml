[project]
name = "graphcode"
version = "0.1.0"
description = "Local viewer of a Python codebase's architecture and of how real runs move through it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "tomli>=2 ; python_full_version < '3.11'",
]

[project.scripts]
graphcode = "graphcode.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
